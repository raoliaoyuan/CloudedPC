<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1300" viewBox="0 0 1400 1300">
<title>图 7-2  OpenSSH 访问条件</title>
<desc>箭头表示条件检查顺序，不代表已完成连接或密码认证测试</desc>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#176B99"/></marker>
<marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#A86C16"/></marker>
<marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#64788C"/></marker>
</defs>
<rect width="1400" height="1300" fill="white"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<rect x="40" y="42" width="7" height="38" rx="3" fill="#137B77"/>
<text x="64" y="75.0" text-anchor="start" font-size="34" fill="#16324F" font-weight="700">图 7-2  OpenSSH 访问条件</text>
<text x="64" y="109.0" text-anchor="start" font-size="18" fill="#52647A" font-weight="400">箭头表示条件检查顺序，不代表已完成连接或密码认证测试</text>
<rect x="60" y="330" width="1280" height="160" rx="18" fill="#F6F9FC" stroke="#A9BED0" stroke-width="1.5"/>
<text x="84" y="367.0" text-anchor="start" font-size="22" fill="#16324F" font-weight="700">平台外层 · 需要平台核验</text>
<rect x="60" y="545" width="1280" height="620" rx="18" fill="#F6F9FC" stroke="#A9BED0" stroke-width="1.5"/>
<text x="84" y="582.0" text-anchor="start" font-size="22" fill="#16324F" font-weight="700">容器内部 · 已核对配置</text>
<polyline points="700,265 700,385" fill="none" stroke="#176B99" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<polyline points="700,470 700,615" fill="none" stroke="#176B99" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<polyline points="700,730 700,815" fill="none" stroke="#176B99" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<polyline points="700,950 700,1040" fill="none" stroke="#176B99" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="340" y="180" width="720" height="85" rx="12" fill="#EFF6FB" stroke="#176B99" stroke-width="1.6"/>
<text x="700.0" y="211.995" text-anchor="middle" font-size="21" fill="#16324F" font-weight="700">候选连接</text>
<text x="700.0" y="251.54500000000002" text-anchor="middle" font-size="19" fill="#52647A" font-weight="400">连接目标：容器 OpenSSH TCP 22</text>
<rect x="340" y="385" width="720" height="85" rx="12" fill="#FFF8E9" stroke="#A86C16" stroke-width="1.6" stroke-dasharray="8 6"/>
<text x="700.0" y="417.71999999999997" text-anchor="middle" font-size="21" fill="#16324F" font-weight="700">安全组、路由、端口发布及网络策略是否允许？</text>
<text x="700.0" y="455.82" text-anchor="middle" font-size="18" fill="#52647A" font-weight="400">外层规则未取得，实际来源范围未知</text>
<rect x="340" y="615" width="720" height="115" rx="12" fill="#EFF6FB" stroke="#176B99" stroke-width="1.6"/>
<text x="700.0" y="648.22" text-anchor="middle" font-size="21" fill="#16324F" font-weight="700">监听与已检查的 INPUT 规则</text>
<text x="700.0" y="687.77" text-anchor="middle" font-size="19" fill="#52647A" font-weight="400">监听 0.0.0.0:22、[::]:22</text>
<text x="700.0" y="715.32" text-anchor="middle" font-size="19" fill="#52647A" font-weight="400">已检查的 IPv4 / IPv6 INPUT 链无来源限制</text>
<rect x="340" y="815" width="720" height="135" rx="12" fill="#EFF6FB" stroke="#176B99" stroke-width="1.6"/>
<text x="700.0" y="858.22" text-anchor="middle" font-size="21" fill="#16324F" font-weight="700">OpenSSH 认证及账号条件</text>
<text x="700.0" y="897.77" text-anchor="middle" font-size="19" fill="#52647A" font-weight="400">root 密码认证允许；空密码禁止</text>
<text x="700.0" y="925.32" text-anchor="middle" font-size="19" fill="#52647A" font-weight="400">还需有效凭据、账号状态、Shell 与 PAM 条件满足</text>
<rect x="340" y="1040" width="720" height="90" rx="12" fill="#FFF8E9" stroke="#A86C16" stroke-width="1.6" stroke-dasharray="8 6"/>
<text x="700.0" y="1074.495" text-anchor="middle" font-size="21" fill="#16324F" font-weight="700">所有条件满足后才能建立会话</text>
<text x="700.0" y="1114.0449999999998" text-anchor="middle" font-size="19" fill="#52647A" font-weight="400">实际密码登录及密码强度未验证</text>
<text x="60" y="1229.0" text-anchor="start" font-size="19" fill="#52647A" font-weight="400">任一条件不满足，均可能阻止会话建立；仅凭通配地址监听或容器 INPUT 为 ACCEPT，</text>
<text x="60" y="1257.5" text-anchor="start" font-size="19" fill="#52647A" font-weight="400">不能认定公网可达，也不能把访问范围归结为某个已确认的网段。</text>
</g></svg>