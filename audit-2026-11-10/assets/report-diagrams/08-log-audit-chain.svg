<text x="720.0" y="683.62" text-anchor="middle" font-size="21" fill="#16324F" font-weight="700">留存链路未确认</text>
<text x="720.0" y="720.27" text-anchor="middle" font-size="17" fill="#52647A" font-weight="400">常规 auth.log / journal 缺失</text>
<text x="720.0" y="744.92" text-anchor="middle" font-size="17" fill="#52647A" font-weight="400">sshd 标准输出指向空设备</text>
<rect x="1060" y="350" width="340" height="160" rx="12" fill="#EDF8F5" stroke="#137B77" stroke-width="1.6"/>
<text x="1230.0" y="405.71999999999997" text-anchor="middle" font-size="21" fill="#16324F" font-weight="700">平台日志接收端</text>
<text x="1230.0" y="445.27" text-anchor="middle" font-size="19" fill="#52647A" font-weight="400">172.24.0.1:18100</text>
<text x="1230.0" y="472.82" text-anchor="middle" font-size="19" fill="#52647A" font-weight="400">已观察到多个连接</text>
<rect x="1060" y="620" width="340" height="135" rx="12" fill="#FFF8E9" stroke="#A86C16" stroke-width="1.6" stroke-dasharray="8 6"/>
<text x="1230.0" y="664.67" text-anchor="middle" font-size="21" fill="#16324F" font-weight="700">平台日志后台</text>
<text x="1230.0" y="702.77" text-anchor="middle" font-size="18" fill="#52647A" font-weight="400">是否完整入库、可检索</text>
<text x="1230.0" y="728.87" text-anchor="middle" font-size="18" fill="#52647A" font-weight="400">以及保留期限均未验证</text>
<rect x="300" y="940" width="900" height="115" rx="12" fill="#FFF8E9" stroke="#A86C16" stroke-width="1.6" stroke-dasharray="8 6"/>
<text x="750.0" y="973.22" text-anchor="middle" font-size="21" fill="#16324F" font-weight="700">建议补齐并验收的审计事件</text>
<text x="750.0" y="1012.77" text-anchor="middle" font-size="19" fill="#52647A" font-weight="400">登录成功 / 失败、权限变更、服务异常退出、OOM 与关键操作</text>
<text x="750.0" y="1040.32" text-anchor="middle" font-size="19" fill="#52647A" font-weight="400">确认覆盖范围、检索方式、保留期限和导出能力</text>
<rect x="642.0" y="860" width="156.0" height="28" rx="5" fill="white"/>
<text x="720" y="880.0" text-anchor="middle" font-size="17" fill="#176B99" font-weight="400">待平台核验与补齐</text>
<text x="60" y="1114.0" text-anchor="start" font-size="19" fill="#52647A" font-weight="400">存在日志发送连接不等于日志已完整入库；本地日志缺失也不能单独证明平台没有另行采集。</text>
</g></svg>