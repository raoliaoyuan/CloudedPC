<rect x="100" y="265" width="360" height="100" rx="12" fill="#EFF6FB" stroke="#176B99" stroke-width="1.6"/>
<text x="280.0" y="304.495" text-anchor="middle" font-size="21" fill="#16324F" font-weight="700">部分服务标准输出</text>
<text x="280.0" y="344.045" text-anchor="middle" font-size="19" fill="#52647A" font-weight="400">并非所有服务均已确认覆盖</text>
<rect x="550" y="265" width="340" height="100" rx="12" fill="#EFF6FB" stroke="#176B99" stroke-width="1.6"/>
<text x="720.0" y="304.495" text-anchor="middle" font-size="21" fill="#16324F" font-weight="700">log-forward-tee</text>
<text x="720.0" y="344.045" text-anchor="middle" font-size="19" fill="#52647A" font-weight="400">复制及转发输出</text>
<rect x="100" y="455" width="360" height="100" rx="12" fill="#EFF6FB" stroke="#176B99" stroke-width="1.6"/>
<text x="280.0" y="494.495" text-anchor="middle" font-size="21" fill="#16324F" font-weight="700">平台日志文件</text>
<text x="280.0" y="534.045" text-anchor="middle" font-size="19" fill="#52647A" font-weight="400">采集目录与覆盖范围需复核</text>
<rect x="550" y="455" width="340" height="100" rx="12" fill="#EFF6FB" stroke="#176B99" stroke-width="1.6"/>
<text x="720.0" y="494.495" text-anchor="middle" font-size="21" fill="#16324F" font-weight="700">sandbox-log-collector</text>
<text x="720.0" y="534.045" text-anchor="middle" font-size="19" fill="#52647A" font-weight="400">已观察到采集进程运行</text>
<rect x="100" y="650" width="360" height="110" rx="12" fill="#EFF6FB" stroke="#176B99" stroke-width="1.6"/>
<text x="280.0" y="694.495" text-anchor="middle" font-size="21" fill="#16324F" font-weight="700">OpenSSH 认证事件</text>
<text x="280.0" y="734.045" text-anchor="middle" font-size="19" fill="#52647A" font-weight="400">登录成功 / 失败及相关行为</text>
