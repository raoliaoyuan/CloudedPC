<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160">
<title>图 6-1  本地预览与外部访问边界</title>
<desc>蓝色：助手记录；青色：用户结果确认；橙色虚线：未验收的外部访问</desc>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#176B99"/></marker>
<marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#137B77"/></marker>
<marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#A86C16"/></marker>
<marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#64788C"/></marker>
</defs>
<rect width="1400" height="1160" fill="white"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<rect x="40" y="42" width="7" height="38" rx="3" fill="#137B77"/>
<text x="64" y="75.0" text-anchor="start" font-size="34" fill="#16324F" font-weight="700">图 6-1  本地预览与外部访问边界</text>
<text x="64" y="112.0" text-anchor="start" font-size="22" fill="#52647A" font-weight="400">蓝色：助手记录；青色：用户结果确认；橙色虚线：未验收的外部访问</text>
<rect x="55" y="175" width="1290" height="390" rx="18" fill="#F6F9FC" stroke="#A9BED0" stroke-width="1.5"/>
<text x="79" y="215.0" text-anchor="start" font-size="26" fill="#16324F" font-weight="700">Dot 云电脑中的开发与预览〔逻辑范围，不确定具体进程拓扑〕</text>
<polyline points="820,382 580,382" fill="none" stroke="#176B99" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<polyline points="650,790 750,790" fill="none" stroke="#A86C16" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-amber)"/>
<polyline points="1040,705 1040,625 340,625 340,465" fill="none" stroke="#A86C16" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-amber)"/>
<rect x="100" y="300" width="480" height="165" rx="12" fill="#EFF6FB" stroke="#176B99" stroke-width="1.6"/>
<text x="340.0" y="350.66" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">数独 Web 服务〔记录〕</text>
<text x="340.0" y="400.36" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">助手称已启动并打包</text>
<text x="340.0" y="438.06" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">自动测试通过仍缺原始日志</text>
<rect x="820" y="300" width="480" height="165" rx="12" fill="#EDF8F5" stroke="#137B77" stroke-width="1.6"/>
<text x="1060.0" y="350.66" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">云端预览〔用户确认〕</text>
<text x="1060.0" y="400.36" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">用户 #060 表示可以正常玩</text>
<text x="1060.0" y="438.06" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">支持当时的结果可用性</text>
<rect x="70" y="705" width="580" height="170" rx="12" fill="#EFF6FB" stroke="#176B99" stroke-width="1.6"/>
<text x="360.0" y="758.16" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">用户自己的电脑</text>
<text x="360.0" y="807.86" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">本机 localhost 指向本机上下文</text>
<text x="360.0" y="845.56" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">不是 Dot 中同名地址的自动映射</text>
<rect x="750" y="705" width="580" height="170" rx="12" fill="#FFF8E9" stroke="#A86C16" stroke-width="1.6" stroke-dasharray="8 6"/>
<text x="1040.0" y="758.16" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">外部访问入口〔未确认〕</text>
<text x="1040.0" y="807.86" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">公网 IP、入站端口与服务授权</text>
<text x="1040.0" y="845.56" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">独立 SSH、Tailscale 及持续在线</text>
<rect x="646.0" y="325" width="108.0" height="28" rx="5" fill="white"/>
<text x="700" y="345.0" text-anchor="middle" font-size="22" fill="#176B99" font-weight="400">预览访问</text>
<rect x="536.0" y="610" width="328.0" height="28" rx="5" fill="white"/>
<text x="700" y="630.0" text-anchor="middle" font-size="22" fill="#176B99" font-weight="400">需分别验收外部入口及目标服务</text>
<text x="70" y="975.0" text-anchor="start" font-size="25" fill="#52647A" font-weight="400">没有 TUN 不足以排除 Tailscale 用户态模式；但本例没有上线或对端连通验收。</text>
<text x="70" y="1012.5" text-anchor="start" font-size="25" fill="#52647A" font-weight="400">本地预览成功不能替代公网发布验收；Sites 发布能力也不证明 Dot 入站端口开放。</text>
<text x="60" y="1103.0" text-anchor="start" font-size="23" fill="#52647A" font-weight="400">来源：[A #012—#018、#048、#060、#064]；[T4][T9]；[O6]。</text>
</g></svg>