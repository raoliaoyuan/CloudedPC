<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180">
<title>图 3-1  存储视图与容量统计疑点</title>
<desc>蓝色：记录值；橙色虚线：待解释或未确认；计算结果只用于核对口径</desc>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#176B99"/></marker>
<marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#137B77"/></marker>
<marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#A86C16"/></marker>
<marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#64788C"/></marker>
</defs>
<rect width="1400" height="1180" fill="white"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<rect x="40" y="42" width="7" height="38" rx="3" fill="#137B77"/>
<text x="64" y="75.0" text-anchor="start" font-size="34" fill="#16324F" font-weight="700">图 3-1  存储视图与容量统计疑点</text>
<text x="64" y="112.0" text-anchor="start" font-size="22" fill="#52647A" font-weight="400">蓝色：记录值；橙色虚线：待解释或未确认；计算结果只用于核对口径</text>
<polyline points="560,285 560,335 370,335 370,390" fill="none" stroke="#64788C" stroke-width="2.3" stroke-linejoin="round"/>
<polyline points="840,285 840,335 1030,335 1030,390" fill="none" stroke="#64788C" stroke-width="2.3" stroke-linejoin="round"/>
<polyline points="370,550 370,610 530,610 530,665" fill="none" stroke="#A86C16" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-amber)"/>
<polyline points="1030,550 1030,610 870,610 870,665" fill="none" stroke="#A86C16" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-amber)"/>
<rect x="330" y="175" width="740" height="110" rx="12" fill="#EFF6FB" stroke="#176B99" stroke-width="1.6"/>
<text x="700.0" y="217.01" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">工作区文件系统 overlay〔记录〕</text>
<text x="700.0" y="266.71" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">不能据此确定底层物理盘或容器产品</text>
<rect x="70" y="390" width="600" height="160" rx="12" fill="#EFF6FB" stroke="#176B99" stroke-width="1.6"/>
<text x="370.0" y="435.26" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">总量与可用量〔记录〕</text>
<text x="370.0" y="487.86" text-anchor="middle" font-size="28" fill="#52647A" font-weight="400">总量约 62.94 GiB</text>
<text x="370.0" y="528.46" text-anchor="middle" font-size="28" fill="#52647A" font-weight="400">可用约 59.54 GiB</text>
<rect x="730" y="390" width="600" height="160" rx="12" fill="#EFF6FB" stroke="#176B99" stroke-width="1.6"/>
<text x="1030.0" y="435.26" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">已用量〔记录〕</text>
<text x="1030.0" y="487.86" text-anchor="middle" font-size="28" fill="#52647A" font-weight="400">约 195 MiB；约 1%</text>
<text x="1030.0" y="528.46" text-anchor="middle" font-size="28" fill="#52647A" font-weight="400">未取得同一时刻的原始字节数</text>
<rect x="250" y="665" width="900" height="170" rx="12" fill="#FFF8E9" stroke="#A86C16" stroke-width="1.6" stroke-dasharray="8 6"/>
<text x="700.0" y="701.485" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">差额口径待解释〔复核计算〕</text>
<text x="700.0" y="749.735" text-anchor="middle" font-size="25" fill="#52647A" font-weight="400">62.94 − 59.54 = 3.40 GiB，约 3,482 MiB</text>
<text x="700.0" y="785.985" text-anchor="middle" font-size="25" fill="#52647A" font-weight="400">与“已用 195 MiB”不能直接对齐</text>
<text x="700.0" y="822.235" text-anchor="middle" font-size="25" fill="#52647A" font-weight="400">保留空间、统计字段或上下文差异均只是候选解释</text>
<text x="70" y="927.0" text-anchor="start" font-size="27" fill="#52647A" font-weight="400">tmpfs 的各约 4.87 GiB 是上限，不可相加为额外 RAM。</text>
<text x="70" y="967.5" text-anchor="start" font-size="27" fill="#52647A" font-weight="400">SSD / NVMe、IOPS、独享容量与数据保留承诺均未确认。</text>
<text x="60" y="1103.0" text-anchor="start" font-size="23" fill="#52647A" font-weight="400">来源：[A #024]；[T2] OverlayFS；[T3] tmpfs。此差异不等于磁盘损坏或记录造假。</text>
</g></svg>