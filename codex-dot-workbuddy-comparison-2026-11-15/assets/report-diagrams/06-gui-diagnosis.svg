<text x="64" y="75.0" text-anchor="start" font-size="34" fill="#16324F" font-weight="700">图 6  GUI 体验问题的定位逻辑</text>
<text x="64" y="112.0" text-anchor="start" font-size="22" fill="#52647A" font-weight="400">通用诊断框架〔建议〕｜所有候选原因待核验，不是 Dot 已测架构</text>
