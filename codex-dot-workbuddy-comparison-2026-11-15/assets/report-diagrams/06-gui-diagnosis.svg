<text x="94" y="730.0" text-anchor="start" font-size="26" fill="#16324F" font-weight="700">按键到可见结果的概念链〔通用技术分析〕</text>
<polyline points="530,290 530,355 370,355 370,420" fill="none" stroke="#A86C16" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-amber)"/>
<polyline points="870,290 870,355 1030,355 1030,420" fill="none" stroke="#A86C16" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-amber)"/>
