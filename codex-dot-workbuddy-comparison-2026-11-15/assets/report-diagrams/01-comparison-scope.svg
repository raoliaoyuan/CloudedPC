<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050">
<title>图 1  比较对象与证据边界</title>
<desc>逻辑范围图｜蓝色：历史资料，等级见框内；青色：官方；橙色虚线：未确认</desc>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#176B99"/></marker>
<marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#137B77"/></marker>
<marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#A86C16"/></marker>
<marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#64788C"/></marker>
</defs>
<rect width="1400" height="1050" fill="white"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<rect x="40" y="42" width="7" height="38" rx="3" fill="#137B77"/>
<text x="64" y="75.0" text-anchor="start" font-size="34" fill="#16324F" font-weight="700">图 1  比较对象与证据边界</text>
<text x="64" y="112.0" text-anchor="start" font-size="22" fill="#52647A" font-weight="400">逻辑范围图｜蓝色：历史资料，等级见框内；青色：官方；橙色虚线：未确认</text>
<rect x="50" y="175" width="620" height="660" rx="18" fill="#F6F9FC" stroke="#A9BED0" stroke-width="1.5"/>
<text x="74" y="215.0" text-anchor="start" font-size="26" fill="#16324F" font-weight="700">Codex Dot 云电脑</text>
<rect x="730" y="175" width="620" height="660" rx="18" fill="#F6F9FC" stroke="#A9BED0" stroke-width="1.5"/>
<text x="754" y="215.0" text-anchor="start" font-size="26" fill="#16324F" font-weight="700">WorkBuddy 云 PC 本实例</text>
<rect x="85" y="265" width="550" height="150" rx="12" fill="#EDF8F5" stroke="#137B77" stroke-width="1.6"/>
<text x="360.0" y="308.16" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">任务与云电脑〔官方〕</text>
<text x="360.0" y="357.86" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">Dot 有自有云电脑与浏览器</text>
<text x="360.0" y="395.56" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">可委派任务并由用户必要时接管</text>
<rect x="85" y="465" width="550" height="145" rx="12" fill="#EFF6FB" stroke="#176B99" stroke-width="1.6"/>
<text x="360.0" y="505.66" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">实例证据〔记录与观察〕</text>
<text x="360.0" y="555.3600000000001" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">配置多为历史助手陈述</text>
<text x="360.0" y="593.0600000000001" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">数独可玩与 GUI 操作有用户确认</text>
<rect x="85" y="660" width="550" height="125" rx="12" fill="#FFF8E9" stroke="#A86C16" stroke-width="1.6" stroke-dasharray="8 6"/>
<text x="360.0" y="709.51" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">部署细节〔未确认〕</text>
<text x="360.0" y="759.21" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">运行时、配额、底层拓扑</text>
<rect x="765" y="265" width="550" height="150" rx="12" fill="#EFF6FB" stroke="#176B99" stroke-width="1.6"/>
<text x="1040.0" y="308.16" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">Tencent Cloud CVM〔实测线索〕</text>
<text x="1040.0" y="357.86" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">DMI 厂商与产品标识</text>
<text x="1040.0" y="395.56" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">当前工作区是 Linux 容器</text>
<rect x="765" y="465" width="550" height="145" rx="12" fill="#EFF6FB" stroke="#176B99" stroke-width="1.6"/>
<text x="1040.0" y="505.66" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">容器内管理〔历史实测〕</text>
<text x="1040.0" y="555.3600000000001" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">终端、CodeBuddy 与 Docker 组件</text>
<text x="1040.0" y="593.0600000000001" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">有配置、进程和访问证据</text>
<rect x="765" y="660" width="550" height="125" rx="12" fill="#FFF8E9" stroke="#A86C16" stroke-width="1.6" stroke-dasharray="8 6"/>
<text x="1040.0" y="710.96" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">宿主能力〔未确认〕</text>
<text x="1040.0" y="757.76" text-anchor="middle" font-size="24" fill="#52647A" font-weight="400">Sysbox 特征是推断；无宿主管理权</text>
<text x="70" y="905.0" text-anchor="start" font-size="25" fill="#52647A" font-weight="400">Dot 自有云电脑、委派的 Codex Cloud 与连接的个人电脑不能混为同一环境。</text>
<text x="70" y="942.5" text-anchor="start" font-size="25" fill="#52647A" font-weight="400">两边都涉及代理工具；本图不比较代理模型质量，也不把单个实例泛化为产品规格。</text>
<text x="60" y="1012.0" text-anchor="start" font-size="22" fill="#52647A" font-weight="400">来源：[W1 第 2、5、8 章][A #024、#060][U1][O1][O3]。</text>
</g></svg>