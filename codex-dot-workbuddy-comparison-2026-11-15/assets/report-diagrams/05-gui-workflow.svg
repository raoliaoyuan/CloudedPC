<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180">
<title>图 5  人工操作与控制权交接</title>
<desc>青色：Dot 官方流程；蓝色：WorkBuddy 历史实测；橙色：未确认</desc>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#176B99"/></marker>
<marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#137B77"/></marker>
<marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#A86C16"/></marker>
<marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#64788C"/></marker>
</defs>
<rect width="1400" height="1180" fill="white"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<rect x="40" y="42" width="7" height="38" rx="3" fill="#137B77"/>
<text x="64" y="75.0" text-anchor="start" font-size="34" fill="#16324F" font-weight="700">图 5  人工操作与控制权交接</text>
<text x="64" y="112.0" text-anchor="start" font-size="22" fill="#52647A" font-weight="400">青色：Dot 官方流程；蓝色：WorkBuddy 历史实测；橙色：未确认</text>
<rect x="50" y="170" width="620" height="785" rx="18" fill="#F6F9FC" stroke="#A9BED0" stroke-width="1.5"/>
<text x="74" y="210.0" text-anchor="start" font-size="26" fill="#16324F" font-weight="700">Dot 人工介入流程</text>
<rect x="730" y="170" width="620" height="785" rx="18" fill="#F6F9FC" stroke="#A9BED0" stroke-width="1.5"/>
<text x="754" y="210.0" text-anchor="start" font-size="26" fill="#16324F" font-weight="700">WorkBuddy 已验证界面范围</text>
<polyline points="360,370 360,425" fill="none" stroke="#137B77" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<polyline points="360,535 360,590" fill="none" stroke="#137B77" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<polyline points="360,700 360,755" fill="none" stroke="#137B77" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="90" y="260" width="540" height="110" rx="12" fill="#EDF8F5" stroke="#137B77" stroke-width="1.6"/>
<text x="360.0" y="302.01" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">打开云电脑</text>
<text x="360.0" y="351.71" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">查看画面</text>
<rect x="90" y="425" width="540" height="110" rx="12" fill="#EDF8F5" stroke="#137B77" stroke-width="1.6"/>
<text x="360.0" y="467.01" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">Take over</text>
<text x="360.0" y="516.71" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">取得鼠标与键盘控制</text>
<rect x="90" y="590" width="540" height="110" rx="12" fill="#EDF8F5" stroke="#137B77" stroke-width="1.6"/>
<text x="360.0" y="632.01" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">完成必要操作</text>
<text x="360.0" y="681.71" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">例如登录或检查结果</text>
<rect x="90" y="755" width="540" height="110" rx="12" fill="#EDF8F5" stroke="#137B77" stroke-width="1.6"/>
<text x="360.0" y="797.01" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">Return control</text>
<text x="360.0" y="846.71" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">交还后由 Dot 继续任务</text>
<rect x="770" y="260" width="540" height="155" rx="12" fill="#EFF6FB" stroke="#176B99" stroke-width="1.6"/>
<text x="1040.0" y="305.66" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">终端与预览组件〔实测〕</text>
<text x="1040.0" y="355.36" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">平台终端、editor-sdk 运行</text>
<text x="1040.0" y="393.06" text-anchor="middle" font-size="26" fill="#52647A" font-weight="400">VS Code 配置按需启动</text>
<rect x="770" y="500" width="540" height="170" rx="12" fill="#FFF8E9" stroke="#A86C16" stroke-width="1.6" stroke-dasharray="8 6"/>
<text x="1040.0" y="554.61" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">完整桌面〔未验收〕</text>
<text x="1040.0" y="602.86" text-anchor="middle" font-size="25" fill="#52647A" font-weight="400">有相关软件包不等于运行会话</text>
<text x="1040.0" y="639.11" text-anchor="middle" font-size="25" fill="#52647A" font-weight="400">不能直接视为 Dot 的 GUI 替代品</text>
<rect x="770" y="755" width="540" height="110" rx="12" fill="#FFF8E9" stroke="#A86C16" stroke-width="1.6" stroke-dasharray="8 6"/>
<text x="1040.0" y="798.46" text-anchor="middle" font-size="28" fill="#16324F" font-weight="700">同场景 GUI 对照〔缺失〕</text>
<text x="1040.0" y="845.26" text-anchor="middle" font-size="24" fill="#52647A" font-weight="400">没有足够证据评定哪边更好用</text>
<text x="75" y="1020.0" text-anchor="start" font-size="25" fill="#52647A" font-weight="400">〔推断〕交接流程支持“围绕代理任务组织交互”的解释。</text>
<text x="75" y="1057.5" text-anchor="start" font-size="25" fill="#52647A" font-weight="400">它不能证明界面简陋是刻意设计，或安全、成本与代理工作的必要代价。</text>
<text x="60" y="1142.0" text-anchor="start" font-size="22" fill="#52647A" font-weight="400">来源：[O1][O3][W1 第 4、5 章][U1]；不是 GUI 性能测试。</text>
</g></svg>